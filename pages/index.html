<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- AUTH SCREEN -->
  <section id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">§</span>
        <h1>Ledger</h1>
      </div>
      <p class="brand-sub">a running account of what's left to do</p>

      <div class="tab-row">
        <button class="tab-btn active" data-tab="login">Sign in</button>
        <button class="tab-btn" data-tab="register">Open an account</button>
      </div>

      <form id="login-form" class="auth-form active">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="primary-btn">Sign in</button>
        <p class="form-msg" data-msg="login"></p>
      </form>

      <form id="register-form" class="auth-form">
        <label>Username
          <input type="text" name="username" required autocomplete="username" />
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="new-password" />
        </label>
        <button type="submit" class="primary-btn">Open account</button>
        <p class="form-msg" data-msg="register"></p>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard-screen" class="screen">
    <aside class="ledger-summary">
      <div class="brand">
        <span class="brand-mark">§</span>
        <h1>Ledger</h1>
      </div>

      <div class="account-line">
        <span class="account-label">held by</span>
        <span id="username-display" class="account-name">—</span>
      </div>

      <dl class="stat-block">
        <div class="stat-row">
          <dt>open</dt>
          <dd id="stat-open">0</dd>
        </div>
        <div class="stat-row">
          <dt>closed</dt>
          <dd id="stat-closed">0</dd>
        </div>
        <div class="stat-row total">
          <dt>total entries</dt>
          <dd id="stat-total">0</dd>
        </div>
      </dl>

      <button id="logout-btn" class="ghost-btn">Close account</button>
    </aside>

    <main class="ledger-main">
      <form id="add-todo-form" class="add-entry-row">
        <input type="text" id="add-todo-input" placeholder="Record a new entry…" required autocomplete="off" />
        <button type="submit" class="primary-btn">Add entry</button>
      </form>

      <div id="todo-list" class="entry-list"></div>

      <p id="empty-state" class="empty-state">
        The ledger is empty. Nothing recorded yet — add your first entry above.
      </p>
    </main>
  </section>

  <!-- Entry template -->
  <template id="todo-template">
    <article class="entry" data-id="">
      <div class="entry-row">
        <button class="stamp" aria-label="Toggle complete">
          <svg viewBox="0 0 24 24" class="stamp-check"><polyline points="4,13 9,18 20,6"></polyline></svg>
        </button>
        <span class="entry-no"></span>
        <p class="entry-content"></p>
        <button class="icon-btn expand-btn" aria-label="Toggle sub-entries">＋</button>
        <button class="icon-btn delete-btn" aria-label="Delete entry">✕</button>
      </div>
      <div class="sub-panel">
        <div class="sub-list"></div>
        <form class="add-sub-form">
          <input type="text" class="add-sub-input" placeholder="Add sub-entry…" autocomplete="off" />
          <button type="submit" class="ghost-btn small">Add</button>
        </form>
      </div>
    </article>
  </template>

  <template id="subtodo-template">
    <div class="sub-entry" data-id="">
      <button class="stamp small" aria-label="Toggle complete">
        <svg viewBox="0 0 24 24" class="stamp-check"><polyline points="4,13 9,18 20,6"></polyline></svg>
      </button>
      <p class="sub-content"></p>
      <button class="icon-btn delete-btn" aria-label="Delete sub-entry">✕</button>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
